<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AgriPro is a smart agriculture dashboard for real-time soil moisture, weather, crop advisory, disease detection and irrigation monitoring." />
    <meta name="theme-color" content="#1F5132" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AgriPro — Smart Agriculture</title>

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://agripro-ai.vercel.app/" />
    <meta property="og:title" content="AgriPro — Smart Agriculture" />
    <meta property="og:description" content="Real-time soil moisture, weather, crop advisory, disease detection and irrigation monitoring for farmers." />
    <meta property="og:image" content="https://agripro-ai.vercel.app/hero-field.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AgriPro — Smart Agriculture" />
    <meta name="twitter:description" content="Real-time soil moisture, weather, crop advisory, disease detection and irrigation monitoring for farmers." />
    <meta name="twitter:image" content="https://agripro-ai.vercel.app/hero-field.jpg" />

    <!-- The hero photo is the largest above-the-fold element (LCP), so it's worth
         preloading rather than letting it compete with JS/CSS for bandwidth. -->
    <link rel="preload" as="image" href="/hero-field.jpg" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,500&family=IBM+Plex+Mono:wght@400;500;600&family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var t = localStorage.getItem('ap_theme') || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('ap_lang'); if (l) document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>AgriPro needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
